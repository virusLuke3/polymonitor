      <path d="M0,0 L10,5.5 L0,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .label{font:700 24px Inter,Arial,sans-serif;fill:#0f172a}
      .small{font:500 15px Inter,Arial,sans-serif;fill:#475569}
