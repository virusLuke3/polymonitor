<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">polyMonitor Forecast Intelligence Graph Architecture</title>
  <desc id="desc">A paper-style architecture diagram showing data sources, deterministic evidence pipeline, model-backed agent layer, runtime memory, and panel outputs.</desc>
  <defs>
    <linearGradient id="centerBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fffb"/>
      <stop offset="0.54" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#f6f2ff"/>
    </linearGradient>
    <linearGradient id="leftBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fffb"/>
      <stop offset="1" stop-color="#f1fff6"/>
    </linearGradient>
    <linearGradient id="rightBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbf7ff"/>
      <stop offset="1" stop-color="#fff7fd"/>
    </linearGradient>
    <linearGradient id="agentBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7f0"/>
      <stop offset="1" stop-color="#f4fbff"/>
