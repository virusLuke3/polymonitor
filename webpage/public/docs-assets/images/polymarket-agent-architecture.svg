<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Forecast Intelligence Graph architecture</title>
  <desc id="desc">A structured prediction-market workflow with deterministic evidence, parallel specialist agents, limited bull bear debate, calibration, panel adaptation, snapshot storage, and resolution memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fff8"/>
      <stop offset="0.48" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee477"/>
      <stop offset="1" stop-color="#13b981"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fecdd3"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102016" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#65756d"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #0f1f17; font-size: 36px; font-weight: 750; }
      .subtitle { fill: #59675f; font-size: 17px; font-weight: 500; }
      .section { fill: #10b981; font-size: 13px; font-weight: 780; letter-spacing: .05em; }
      .label { fill: #12201a; font-size: 18px; font-weight: 760; }
      .small { fill: #53635a; font-size: 13px; font-weight: 520; }
      .tiny { fill: #627269; font-size: 11px; font-weight: 520; }
      .mono { fill: #25362f; font-size: 11px; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .box { fill: #ffffff; stroke: #dfe8e2; stroke-width: 1.2; filter: url(#shadow); }
      .soft { fill: #f9fffb; stroke: #dfe8e2; stroke-width: 1.2; }
      .lane { fill: rgba(255,255,255,.72); stroke: #dce9e1; stroke-width: 1.2; }
      .arrow { fill: none; stroke: #65756d; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #8da199; stroke-width: 2; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1500" height="980" fill="url(#bg)"/>
  <text class="section" x="58" y="58">POLYMARKET AGENT</text>
  <text class="title" x="58" y="102">Forecast Intelligence Graph</text>
  <text class="subtitle" x="58" y="132">Structured state, specialist evidence, limited debate, calibration, and resolution feedback.</text>

  <rect class="lane" x="52" y="172" width="1396" height="112" rx="16"/>
  <text class="section" x="78" y="207">MARKET TRIGGER + INPUT STATE</text>

  <rect class="box" x="78" y="224" width="162" height="44" rx="11"/>
  <text class="label" x="94" y="243">Market trigger</text>
  <text class="tiny" x="94" y="260">timer / force / anomaly</text>

  <rect class="box" x="260" y="224" width="162" height="44" rx="11"/>
  <text class="label" x="276" y="243">Prices</text>
  <text class="tiny" x="276" y="260">latest, 24h, bid/ask</text>

  <rect class="box" x="442" y="224" width="162" height="44" rx="11"/>
  <text class="label" x="458" y="243">Fill tape</text>
  <text class="tiny" x="458" y="260">VWAP, drift, conflicts</text>

  <rect class="box" x="624" y="224" width="162" height="44" rx="11"/>
  <text class="label" x="640" y="243">Resolution</text>
  <text class="tiny" x="640" y="260">criteria, oracle, status</text>

  <rect class="box" x="806" y="224" width="162" height="44" rx="11"/>
  <text class="label" x="822" y="243">Catalysts</text>
  <text class="tiny" x="822" y="260">news, official feeds</text>

  <rect class="box" x="988" y="224" width="162" height="44" rx="11"/>
  <text class="label" x="1004" y="243">Related markets</text>
  <text class="tiny" x="1004" y="260">ladders, derivatives</text>

  <rect class="box" x="1170" y="224" width="162" height="44" rx="11"/>
  <text class="label" x="1186" y="243">Memory</text>
  <text class="tiny" x="1186" y="260">Brier + episodes</text>

  <rect class="lane" x="52" y="324" width="1396" height="414" rx="16"/>
  <text class="section" x="78" y="360">CONTROLLED FORECASTING WORKFLOW</text>

  <rect x="78" y="394" width="192" height="78" rx="14" fill="url(#green)" filter="url(#shadow)"/>
  <text class="label" x="98" y="422" fill="#ffffff">Supervisor</text>
  <text class="small" x="98" y="445" fill="#eafff1">routing, budget, retry</text>
  <text class="mono" x="98" y="463" fill="#eafff1">run_id + state</text>

  <rect class="box" x="330" y="394" width="210" height="78" rx="14"/>
  <text class="label" x="350" y="422">Evidence Builder</text>
  <text class="small" x="350" y="445">deterministic bundle</text>
  <text class="mono" x="350" y="463">input_hash / refs</text>

  <rect class="box" x="600" y="342" width="214" height="62" rx="13"/>
  <text class="label" x="620" y="367">Resolution Agent</text>
  <text class="small" x="620" y="389">wording + oracle traps</text>

  <rect class="box" x="600" y="424" width="214" height="62" rx="13"/>
  <text class="label" x="620" y="449">Microstructure</text>
  <text class="small" x="620" y="471">LOB, flow, fake momentum</text>

  <rect class="box" x="600" y="506" width="214" height="62" rx="13"/>
  <text class="label" x="620" y="531">Catalyst Agent</text>
  <text class="small" x="620" y="553">official news + timing</text>

  <rect class="box" x="600" y="588" width="214" height="62" rx="13"/>
  <text class="label" x="620" y="613">Related Markets</text>
  <text class="small" x="620" y="635">same-event inconsistencies</text>

  <rect class="box" x="600" y="670" width="214" height="50" rx="13"/>
  <text class="label" x="620" y="700">Quant Forecaster</text>

  <rect x="884" y="392" width="176" height="64" rx="14" fill="url(#amber)" filter="url(#shadow)"/>
  <text class="label" x="904" y="418">Bull Agent</text>
  <text class="small" x="904" y="440">upside case only</text>

  <rect x="884" y="486" width="176" height="64" rx="14" fill="url(#rose)" filter="url(#shadow)"/>
  <text class="label" x="904" y="512">Bear Agent</text>
  <text class="small" x="904" y="534">downside / stale case</text>

  <rect class="box" x="884" y="580" width="176" height="64" rx="14"/>
  <text class="label" x="904" y="606">Skeptic</text>
  <text class="small" x="904" y="628">hallucination + traps</text>

  <rect class="box" x="1122" y="424" width="214" height="82" rx="14"/>
  <text class="label" x="1142" y="452">Calibration</text>
  <text class="small" x="1142" y="475">market price + agent prob</text>
  <text class="mono" x="1142" y="494">Brier / category priors</text>

  <rect x="1122" y="552" width="214" height="92" rx="16" fill="url(#blue)" filter="url(#shadow)"/>
  <text class="label" x="1142" y="584" fill="#05202c">Panel Adapter</text>
  <text class="small" x="1142" y="609" fill="#063141">same run, three lenses</text>
  <text class="mono" x="1142" y="630" fill="#063141">overview / special / trend</text>

  <path class="arrow" d="M 174 284 L 174 394"/>
  <path class="arrow" d="M 270 433 L 330 433"/>
  <path class="arrow" d="M 540 433 L 600 373"/>
  <path class="arrow" d="M 540 433 L 600 455"/>
  <path class="arrow" d="M 540 433 L 600 537"/>
  <path class="arrow" d="M 540 433 L 600 619"/>
  <path class="arrow" d="M 540 433 L 600 695"/>
  <path class="arrow" d="M 814 373 L 884 424"/>
  <path class="arrow" d="M 814 455 L 884 424"/>
  <path class="arrow" d="M 814 537 L 884 518"/>
  <path class="arrow" d="M 814 619 L 884 612"/>
  <path class="arrow" d="M 814 695 L 884 612"/>
  <path class="arrow" d="M 1060 424 L 1122 465"/>
  <path class="arrow" d="M 1060 518 L 1122 465"/>
  <path class="arrow" d="M 1060 612 L 1122 465"/>
  <path class="arrow" d="M 1229 506 L 1229 552"/>

  <rect class="lane" x="52" y="778" width="1396" height="140" rx="16"/>
  <text class="section" x="78" y="814">OUTPUT + EVALUATION LOOP</text>

  <rect class="soft" x="78" y="838" width="204" height="58" rx="12"/>
  <text class="label" x="96" y="861">AI Insights</text>
  <text class="tiny" x="96" y="880">market-wide read</text>

  <rect class="soft" x="306" y="838" width="204" height="58" rx="12"/>
  <text class="label" x="324" y="861">Special Radar</text>
  <text class="tiny" x="324" y="880">anomaly + mispricing</text>

  <rect class="soft" x="534" y="838" width="204" height="58" rx="12"/>
  <text class="label" x="552" y="861">Trend Watch</text>
  <text class="tiny" x="552" y="880">category rotation</text>

  <rect class="soft" x="762" y="838" width="204" height="58" rx="12"/>
  <text class="label" x="780" y="861">Event Log</text>
  <text class="tiny" x="780" y="880">node JSON + usage</text>

  <rect class="soft" x="990" y="838" width="204" height="58" rx="12"/>
  <text class="label" x="1008" y="861">Snapshot Store</text>
  <text class="tiny" x="1008" y="880">runtime cache</text>

  <rect class="soft" x="1218" y="838" width="204" height="58" rx="12"/>
  <text class="label" x="1236" y="861">Resolution Memory</text>
  <text class="tiny" x="1236" y="880">Brier + lessons</text>

  <path class="arrow" d="M 1229 644 L 1229 730 C 1229 770 180 770 180 838"/>
  <path class="arrow" d="M 1229 644 L 1229 730 C 1229 770 408 770 408 838"/>
  <path class="arrow" d="M 1229 644 L 1229 730 C 1229 770 636 770 636 838"/>
  <path class="arrow" d="M 1229 644 L 1229 838"/>
  <path class="dashed" d="M 1320 838 C 1420 760 1420 250 1251 268"/>
  <text class="tiny" x="1262" y="940">Resolution updates feed calibration and future runs.</text>
</svg>
