# Render with scripts/deploy/render_panel_transport.py before installation.
# Include inside the existing website server. The pool definitions are rendered
# separately from private configuration. No new cache or collector is created.
# Exact books route must avoid large snapshot transfers on the bulk connection.
location = /wm-api/runtime/weather/books {
    proxy_pass http://polymonitor_interactive_api/runtime/weather/books;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 6s;
    proxy_cache off;
}

# Only exact registered public snapshot paths participate. On-demand map queries,
# hazards routes, LOB and media streams retain their own deadlines/admission.
location ~ ^/wm-api/(v1/)?runtime/(__PUBLIC_PANEL_SNAPSHOT_PATHS__)$ {
    rewrite ^/wm-api/(.*)$ /$1 break;
    proxy_pass http://polymonitor_bulk_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 18s;
    proxy_cache off;
}
