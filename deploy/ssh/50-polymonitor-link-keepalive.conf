# Install on the website relay, validate with sshd -t, then reload sshd.
# Reconnect the two website links separately after verifying their alternate.
# The client already uses ServerAliveInterval=10 / ServerAliveCountMax=3.
# Server-side probes also release abandoned reverse-forward listeners when a
# client disappears without closing TCP; TCP keepalive alone can take hours.
Match User ubuntu
    ClientAliveInterval 15
    ClientAliveCountMax 3
Match all
