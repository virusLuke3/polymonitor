# Install only for the crypto strategy, crypto funding and DeFi token workers.
# The selected route is explicit; do not apply it to the API or other owners.
[Unit]
After=polymonitor-tencent-egress.service
Wants=polymonitor-tencent-egress.service

[Service]
# EnvironmentFile overrides Environment= even in later drop-ins. Append a
# dedicated file after the migrated local.env so the old route cannot win.
EnvironmentFile=%h/.config/polymonitor/source-egress.env
